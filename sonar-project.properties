# ================================
# SONARQUBE - Configuración del Proyecto
# ================================
# Proyecto: TipsterByte FX
# Versión: 0.1.0

# ESTO ES LO IMPORTANTE: Tu servidor local
sonar.host.url=http://localhost:9000
# Tu Token (El que me pasaste)
sonar.token=sqa_183a7e93d35f73d4a5a66a49a851c39c87115604

# Identificación del proyecto
sonar.projectKey=tipsterbyte_fx
sonar.projectName=TipsterByte FX
sonar.projectVersion=0.1.0

# ================================
# FUENTES DE CÓDIGO
# ================================
# Directorios donde está el código fuente de Python
sonar.sources=backend/apps,backend/core,backend/shared

# Excluir carpetas y archivos que no queremos analizar
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/htmlcov/**,**/.venv/**,**/venv/**,**/node_modules/**,**/migrations/**,**/__init__.py,**/.git/**

# ================================
# TESTS
# ================================
# Directorios donde están los tests
sonar.tests=backend/apps,backend/core/tests

# Patrón de archivos de test
sonar.test.inclusions=**/test_*.py,**/tests/**

# ================================
# CONFIGURACIÓN PYTHON
# ================================
# Versión de Python del proyecto
sonar.python.version=3.11

# ================================
# REPORTES DE COVERAGE
# ================================
# Ruta al reporte XML de coverage generado por pytest-cov
sonar.python.coverage.reportPaths=backend/coverage.xml

# Reporte de resultados de tests (JUnit XML)
sonar.python.xunit.reportPath=backend/test-results.xml

# ================================
# LINTER (OPCIONAL)
# ================================
# Si generas reportes de flake8, descomenta estas líneas:
# sonar.python.flake8.reportPaths=backend/flake8-report.txt

# ================================
# CONFIGURACIÓN GENERAL
# ================================
# Encoding del código fuente
sonar.sourceEncoding=UTF-8

# Incluir solo archivos Python
sonar.inclusions=**/*.py

# ================================
# LOGGING
# ================================
# Nivel de verbosidad del análisis (INFO, DEBUG, TRACE)
sonar.log.level=INFO

# ================================
# EXCLUSIONES ADICIONALES
# ================================
# Las exclusiones están consolidadas arriba
