# docker-compose.yml - Configuración con perfiles para desarrollo y producción
# Uso:
#   Desarrollo: docker-compose --profile dev up -d
#   Producción: docker-compose --profile prod up -d

networks:
  tipsterbyte_net:
    driver: bridge

services:
  # ====================
  # PostgreSQL - Desarrollo
  # ====================
  postgres_tipsterbyte_dev:
    image: postgres:17
    container_name: db_pg_tipsterbyte_fx_dev
    profiles: [ "dev" ]
    env_file:
      - ./backend/.env.dev
    volumes:
      - database_data_dev:/var/lib/postgresql/data
      - ./backend/backups/postgresql_backups:/backups
    ports:
      - "5433:5432"
    networks:
      - tipsterbyte_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================
  # PostgreSQL - Producción
  # ====================
  postgres_tipsterbyte_prod:
    image: postgres:17
    container_name: db_pg_tipsterbyte_fx_prod
    profiles: [ "prod" ]
    env_file:
      - ./backend/.env.prod
    volumes:
      - database_data_prod:/var/lib/postgresql/data
      - ./backend/backups/postgresql_backups:/backups
    ports:
      - "5432:5432"
    networks:
      - tipsterbyte_net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ====================
  # MongoDB - Desarrollo
  # ====================
  mongo_tipsterbyte_dev:
    image: mongo:5.0
    container_name: db_mongo_tipsterbyte_fx_dev
    profiles: [ "dev" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: tipster_admin
      MONGO_INITDB_ROOT_PASSWORD: tipster_mongo_pass
    env_file:
      - ./backend/.env.dev
    ports:
      - "27017:27017"
    volumes:
      - mongodata_dev:/data/db
      - ./backend/backups/mongo_backups:/backups
    networks:
      - tipsterbyte_net
    restart: unless-stopped

  # ====================
  # MongoDB - Producción
  # ====================
  mongo_tipsterbyte_prod:
    image: mongo:5.0
    container_name: db_mongo_tipsterbyte_fx_prod
    profiles: [ "prod" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: tipster_admin
      MONGO_INITDB_ROOT_PASSWORD: tipster_mongo_pass
    env_file:
      - ./backend/.env.prod
    ports:
      - "27017:27017"
    volumes:
      - mongodata_prod:/data/db
      - ./backend/backups/mongo_backups:/backups
    networks:
      - tipsterbyte_net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ====================
  # SonarQube - Análisis de Calidad (Versión 10.5.1 LTA - Long-Term Active)
  # ====================
  sonarqube:
    profiles: [ "dev" ]
    image: sonarqube:community
    container_name: sonarqube_tipsterbyte
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_WEB_PORT=9000
      # Conexión a PostgreSQL (base de datos dedicada para SonarQube)
      - SONAR_JDBC_URL=jdbc:postgresql://postgres_tipsterbyte_dev:5432/sonarqube
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
      # Optimización de memoria (aprovechando RAM disponible)
      - SONAR_WEB_JAVAOPTS=-Xmx4096m -Xms1024m
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - tipsterbyte_net
    depends_on:
      - postgres_tipsterbyte_dev
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/system/status" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  database_data_dev:
  database_data_prod:
  mongodata_dev:
  mongodata_prod:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
